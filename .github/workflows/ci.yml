name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flame
          POSTGRES_PASSWORD: flame_dev_password
          POSTGRES_DB: flame
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flame -d flame"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://flame:flame_dev_password@localhost:5432/flame
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RESTAURANT_TIME_ZONE: UTC
      PAYMENT_MOCK_ENABLED: "true"
      MOCK_WEBHOOK_SECRET: flame-ci-only-secret
      EMAIL_PROVIDER: gmail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run qa:i18n
      - run: npm run qa:static
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:smoke
